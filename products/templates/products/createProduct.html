{% extends "products/base.html" %}

{% block content %}
<div class="ms-3">
    <h2>Create Product</h2>
    {% load crispy_forms_tags %}

    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}

        <button type="submit" class="btn btn-primary">
            Create
        </button>
    </form>
</div>
{% endblock %}
