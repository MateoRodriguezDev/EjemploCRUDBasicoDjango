{% extends "products/base.html" %}

{% block content %}
    <h2>{{ product.name }}</h2>
    <p>{{ product.description }}</p>
    <p>Price: {{ product.price }}</p>
    <p>Available: {{ product.available }}</p>
    <p>Created: {{ product.created }}</p>
    
    <a href="{% url 'product-list' %}">Go back to all products</a>
{% endblock %}
